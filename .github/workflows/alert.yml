name: Alert

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Update unlisted
      env:
        REFRESH_URL: https://born-to-llama.herokuapp.com/refresh
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
      run: |
        set -euo pipefail
        url="$REFRESH_URL"
        max_attempts=5
        delay=5
        for attempt in $(seq 1 $max_attempts); do
          echo "Attempt $attempt/$max_attempts: $url"
          resp_file=$(mktemp)
          if [ -n "${SERVICE_TOKEN:-}" ]; then
            status=$(curl --silent --show-error --write-out "%{http_code}" --max-time 30 -H "Authorization: Bearer $SERVICE_TOKEN" -o "$resp_file" "$url" || echo "000")
          else
            status=$(curl --silent --show-error --write-out "%{http_code}" --max-time 30 -o "$resp_file" "$url" || echo "000")
          fi

          if [[ "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "Success (HTTP $status)"
            head -c 1024 "$resp_file" || true
            rm -f "$resp_file"
            break
          fi

          echo "Request failed with HTTP $status"
          head -c 1024 "$resp_file" || true
          rm -f "$resp_file" || true

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "Max attempts reached ($max_attempts). Failing the step."
            exit 1
          fi

          echo "Retrying in ${delay}s..."
          sleep $delay
          delay=$(( delay * 2 ))
        done

    - name: Deploy to server
      env:
        REBUILD_URL: https://born-to-llama.herokuapp.com/rebuild-server
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
      run: |
        set -euo pipefail
        url="$REBUILD_URL"
        max_attempts=5
        delay=5
        for attempt in $(seq 1 $max_attempts); do
          echo "Attempt $attempt/$max_attempts: $url"
          resp_file=$(mktemp)
          if [ -n "${SERVICE_TOKEN:-}" ]; then
            status=$(curl --silent --show-error --write-out "%{http_code}" --max-time 60 -H "Authorization: Bearer $SERVICE_TOKEN" -o "$resp_file" "$url" || echo "000")
          else
            status=$(curl --silent --show-error --write-out "%{http_code}" --max-time 60 -o "$resp_file" "$url" || echo "000")
          fi

          if [[ "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "Success (HTTP $status)"
            head -c 1024 "$resp_file" || true
            rm -f "$resp_file"
            break
          fi

          echo "Request failed with HTTP $status"
          head -c 1024 "$resp_file" || true
          rm -f "$resp_file" || true

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "Max attempts reached ($max_attempts). Failing the step."
            exit 1
          fi

          echo "Retrying in ${delay}s..."
          sleep $delay
          delay=$(( delay * 2 ))
        done
