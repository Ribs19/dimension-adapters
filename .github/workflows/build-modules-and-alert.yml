name: Build dimensionModules and alert unlisted projects

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run buildImports script
        run: pnpm run build

      - name: Publish dimensionModules.json as "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest dimensionModules
          artifacts: cli/dimensionModules.json
          allowUpdates: true
  alert-unlisted:
    needs: build-and-upload  # waits for build-and-upload to succeed first
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Update unlisted
      run: |
        for i in {1..3}; do
          if curl --fail --max-time 10 https://born-to-llama.llama.fi/refresh-dimensions; then
            exit 0
          fi
          if [ $i -lt 3 ]; then
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        echo "All retry attempts failed"
        exit 1
